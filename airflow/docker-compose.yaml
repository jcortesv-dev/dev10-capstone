services:
  airflow:
    image: apache/airflow:latest
    container_name: airflow
    hostname: airflow
    command: airflow standalone
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas psycopg[binary] dynaconf"
    ports:
      - 8081:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
